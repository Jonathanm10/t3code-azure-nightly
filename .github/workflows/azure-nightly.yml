name: Azure fork Nightly

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-nightly-publisher
  cancel-in-progress: false

jobs:
  integrate:
    if: github.ref == 'refs/heads/release-control' && github.repository == 'Jonathanm10/t3code-azure-nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_build: ${{ steps.integrate.outputs.should_build }}
      version: ${{ steps.integrate.outputs.version }}
      source_sha: ${{ steps.integrate.outputs.source_sha }}
      upstream_sha: ${{ steps.integrate.outputs.upstream_sha }}
      upstream_tag: ${{ steps.integrate.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: azure-nightly
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Merge a concrete upstream Nightly without candidate execution
        id: integrate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node controller/scripts/azure-nightly/integrate.mjs candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.integrate.outputs.should_build == 'true'
        with:
          name: azure-nightly-provenance
          path: candidate/azure-nightly-provenance.json
          if-no-files-found: error

  candidate:
    if: needs.integrate.outputs.should_build == 'true'
    needs: integrate
    runs-on: macos-15
    permissions:
      contents: read
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
    steps:
      - name: Require explicit public desktop configuration
        run: |
          node --input-type=module -e 'for (const key of ["T3CODE_CLERK_PUBLISHABLE_KEY", "T3CODE_CLERK_JWT_TEMPLATE", "T3CODE_CLERK_CLI_OAUTH_CLIENT_ID", "T3CODE_RELAY_URL"]) if (!process.env[key]?.trim()) throw new Error(`Required public build config is absent: ${key}`); if (!/^pk_(live|test)_/.test(process.env.T3CODE_CLERK_PUBLISHABLE_KEY)) throw new Error("Invalid public Clerk key"); if (new URL(process.env.T3CODE_RELAY_URL).protocol !== "https:") throw new Error("Relay must use HTTPS");'
      - name: Require the standard Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.integrate.outputs.source_sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - name: Install candidate dependencies without signing credentials
        run: vp install --frozen-lockfile
      - name: Focused extraction, profile and release checks
        run: |
          node --experimental-test-module-mocks --test scripts/azure-nightly/release-policy.test.mjs scripts/azure-nightly/integrate.test.mjs scripts/azure-nightly/sign.test.mjs scripts/azure-nightly/publish.test.mjs scripts/azure-nightly/cli-archive.test.mjs
          python3 -B -m unittest discover -s scripts/azure-nightly -p test_extract_app.py
          vp test run scripts/build-desktop-artifact.test.ts -t 'unreviewed Electron|omits inherited passkey|platform-specific packaging'
          vp test run apps/desktop/scripts/origin-migration.test.mjs apps/desktop/scripts/electron-launcher.test.mjs apps/desktop/src/electron/ElectronProtocol.test.ts apps/desktop/src/app/DesktopPreReadyPlatform.test.ts apps/desktop/src/app/DesktopLinuxUrlHandler.test.ts apps/desktop/src/window/DesktopWindow.test.ts apps/desktop/src/app/DesktopForkProfile.test.ts apps/desktop/src/app/DesktopUserData.test.ts apps/desktop/src/app/DesktopClerk.test.ts apps/desktop/src/electron/ElectronUpdater.test.ts scripts/azure-nightly/artifact-export.test.ts packages/shared/src/providerAuthReturnUrl.test.ts packages/shared/src/codexAuthHandoff.test.ts packages/shared/src/promptLinks.test.ts apps/server/src/auth/EnvironmentAuth.test.ts
          vp exec --filter @t3tools/desktop -- tsc-rs --noEmit
          vp exec --filter t3 -- tsc-rs --noEmit
          vp exec --filter @t3tools/web -- tsc-rs --noEmit
          vp test run apps/server/src/pullRequest/PullRequestService.test.ts apps/web/src/lib/openPullRequestLink.test.ts apps/web/src/hooks/usePullRequestLinking.test.ts packages/client-runtime/src/pullRequestLinkInput.test.ts
          node apps/web/node_modules/playwright/cli.js install --only-shell chromium
          vp exec --filter @t3tools/web -- vp test run --project browser src/lib/openPullRequestLink.navigation.browser.test.tsx src/components/ChatMarkdown.pull-request-preview.browser.test.tsx src/components/ChatMarkdown.browser.test.tsx src/components/pullRequest/PullRequestDetailPanel.browser.test.tsx src/components/pullRequest/pullRequestActors.browser.test.tsx src/components/settings/SourceControlHostSettings.browser.test.tsx
          vp test run apps/server/src/persistence/Migrations/063_DropUnusedV1Projections.test.ts apps/server/scripts/history-handoff/HistoryCapturePolicy.test.ts apps/server/scripts/history-handoff/HistoryAssets.test.ts apps/server/scripts/history-handoff/HistoryCopy.test.ts apps/server/scripts/history-handoff/HistoryFreeze.test.ts apps/server/scripts/history-handoff/HistoryReferences.test.ts apps/server/src/orchestration-v2/testkit/NativeContext.integration.test.ts apps/server/src/orchestration-v2/testkit/NativeContext.recovery.test.ts apps/server/src/orchestration-v2/testkit/DetachedHistoryContinuation.integration.test.ts apps/server/src/orchestration-v2/testkit/DetachedHistoryContinuation.recovery.test.ts apps/server/src/orchestration-v2/ContextHandoffBudget.test.ts apps/server/src/orchestration-v2/ContextHandoffService.test.ts apps/server/src/orchestration-v2/ProviderTurnStartService.test.ts apps/server/src/orchestration-v2/TurnStartReads.test.ts apps/server/src/orchestration-v2/Orchestrator.control-reads.test.ts apps/server/src/orchestration-v2/ProviderTurnControlService.test.ts
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 vp test run apps/server/src/orchestration-v2/testkit/ProviderSwitch.integration.test.ts -t 'resumes a queued account switch without requiring a portable handoff'
          vp run --filter @jonathanm10/azure-devops-server-client typecheck
          vp run --filter @jonathanm10/azure-devops-server-client test
          vp run --filter @jonathanm10/azure-devops-server-mcp typecheck
          vp run --filter @jonathanm10/azure-devops-server-mcp test
          vp run --filter @t3tools/source-control-azure-devops typecheck
          vp run --filter @t3tools/source-control-azure-devops test
      - name: Package the standalone public core and MCP from the clean source
        env:
          SOURCE_SHA: ${{ needs.integrate.outputs.source_sha }}
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          node packages/azure-devops-server-mcp/scripts/pack.mjs --out "$GITHUB_WORKSPACE/unsigned" --source "$SOURCE_SHA"
      - name: Build an unsigned candidate as data for the trusted signer
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: Jonathanm10/t3code-azure-nightly
          T3CODE_DESKTOP_SIGNED: "false"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          FORK_VERSION: ${{ needs.integrate.outputs.version }}
        run: |
          node scripts/update-release-package-versions.ts "$FORK_VERSION"
          node scripts/build-desktop-artifact.ts --platform mac --target zip --arch arm64 --build-version "$FORK_VERSION" --output-dir unsigned-build
          mkdir -p unsigned
          cp "unsigned-build/T3-Code-Azure-${FORK_VERSION}-arm64.zip" unsigned/unsigned-app.zip
      - name: Verify the tarballs from a clean consumer outside the checkout
        run: |
          consumer_dir="$(mktemp -d "$RUNNER_TEMP/azure-consumer.XXXXXX")"
          npm install --prefix "$consumer_dir" --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE"/unsigned/*.tgz
          cd "$consumer_dir"
          node node_modules/@jonathanm10/azure-devops-server-mcp/dist/main.js --help
          node --input-type=module -e 'await import(process.argv[1]);' "$consumer_dir/node_modules/@jonathanm10/azure-devops-server-client/dist/index.js"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: azure-nightly-provenance
          path: unsigned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: azure-nightly-unsigned
          path: unsigned/*
          if-no-files-found: error

  linux-cli:
    if: needs.integrate.outputs.should_build == 'true'
    needs: integrate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.integrate.outputs.source_sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Install native build tools without release credentials
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 pkg-config libsecret-1-dev
      - name: Install candidate dependencies
        run: vp install --frozen-lockfile
      - name: Check release, cache, SSH and combined updater behavior
        run: |
          node --experimental-test-module-mocks --test scripts/azure-nightly/cli-archive.test.mjs scripts/azure-nightly/publish.test.mjs
          vp test run packages/shared/src/cliRelease.test.ts scripts/lib/cli-release-provenance.test.ts apps/server/src/cloud/pinnedRuntime.test.ts apps/server/src/cloud/bootService.test.ts apps/server/src/cloud/selfUpdate.test.ts apps/server/src/serviceLauncher.test.ts packages/ssh/src/tunnel.test.ts scripts/install.test.ts scripts/build-npm-launcher.test.ts apps/web/src/components/sidebar/updateEverything.logic.test.ts apps/web/src/components/sidebar/useUpdateEverything.test.ts
      - name: Build same-source web, server and resource monitor
        env:
          FORK_VERSION: ${{ needs.integrate.outputs.version }}
          SOURCE_SHA: ${{ needs.integrate.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          node scripts/update-release-package-versions.ts "$FORK_VERSION"
          vp run --filter @t3tools/web build
          node apps/server/scripts/cli.ts build --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
      - name: Build native Node SEA
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose
      - name: Package and smoke-test Linux without signing credentials
        env:
          FORK_VERSION: ${{ needs.integrate.outputs.version }}
          SOURCE_SHA: ${{ needs.integrate.outputs.source_sha }}
        run: |
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$FORK_VERSION" --source-sha "$SOURCE_SHA" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir "$RUNNER_TEMP/linux-cli"
          node scripts/smoke-cli-archive.ts --archive "$RUNNER_TEMP/linux-cli/t3-$FORK_VERSION-linux-x64.tar.gz" --expect-version "$FORK_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: azure-nightly-linux
          path: ${{ runner.temp }}/linux-cli/*
          if-no-files-found: error

  sign-and-publish:
    if: needs.integrate.outputs.should_build == 'true'
    needs: [integrate, candidate, linux-cli]
    runs-on: macos-15
    environment: azure-nightly-release
    permissions:
      contents: write
    steps:
      - name: Require protected control and Apple Silicon
        env:
          CONTROL_REF: ${{ github.ref }}
        run: test "$CONTROL_REF" = refs/heads/release-control && test "$(uname -m)" = arm64
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: azure-nightly-unsigned
          path: unsigned
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: azure-nightly-linux
          path: unsigned
      - name: Sign and notarize artifacts without executing candidate code
        env:
          FORK_SIGNING_P12_BASE64: ${{ secrets.FORK_SIGNING_P12_BASE64 }}
          FORK_SIGNING_P12_PASSWORD: ${{ secrets.FORK_SIGNING_P12_PASSWORD }}
          FORK_SIGNING_IDENTITY_SHA1: ${{ vars.FORK_SIGNING_IDENTITY_SHA1 }}
          FORK_APPLE_TEAM_ID: ${{ vars.FORK_APPLE_TEAM_ID }}
          FORK_NOTARY_KEY_BASE64: ${{ secrets.FORK_NOTARY_KEY_BASE64 }}
          FORK_NOTARY_KEY_ID: ${{ vars.FORK_NOTARY_KEY_ID }}
          FORK_NOTARY_ISSUER: ${{ vars.FORK_NOTARY_ISSUER }}
          EXPECTED_SOURCE_SHA: ${{ needs.integrate.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.integrate.outputs.version }}
          EXPECTED_UPSTREAM_SHA: ${{ needs.integrate.outputs.upstream_sha }}
        run: node controller/scripts/azure-nightly/sign.mjs unsigned signed
      - name: Publish only a complete verified immutable draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node controller/scripts/azure-nightly/publish.mjs signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: azure-nightly-signed
          path: signed/*
          if-no-files-found: ignore
      - name: Retain the last good public release on failure
        if: failure()
        run: echo 'Integration, checks, signing, notarization or publication failed. No previous release was deleted.' >> "$GITHUB_STEP_SUMMARY"
